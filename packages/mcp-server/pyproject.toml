[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vexa-mcp"
version = "1.0.56"
description = "VEXA MCP Server — security scanning via Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Noviq Technologies", email = "support@noviqtechnologies.com"}]
keywords = ["mcp", "security", "scanner", "ide", "vscode"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]


dependencies = [
    "vexa-core>=1.0.35",
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
]

[project.urls]
Homepage = "https://vexasec.io"
Repository = "https://github.com/noviqtechnologies/vexa-oss"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vexa_mcp*"]

[tool.uv.sources]
vexa-core = { workspace = true }
