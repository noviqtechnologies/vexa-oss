# Vexa - Basic Quick-Start Workflow
# Minimal workflow for quick onboarding (~20 lines)
# For advanced features (quality gates, PR comments), use github-action.yml

name: Vexa Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Vexa
        uses: noviqtechnologies/vexa@v1
        with:
          format: sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: vexa_reports
        continue-on-error: true
